# dsh-mcphub bundle patch: inserts the plugin row into the web profile roster.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field) over
# dsh-base; the node half (exports ".") runs in the host process (MCP bridge,
# agent tools, status routes, prompt announcement), and the `dsh.client`
# declaration in package.json makes the browser half (exports "./client")
# load in the web GUI.
- insert:
    - id: mcphub
      name: '@dong-victor/dsh-mcphub'
